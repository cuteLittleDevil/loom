<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1160" role="img" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">
  <title>loom 提交与调度流程</title>
  <desc>Submit 进入容量 100 的缓冲，协调者按空闲槽位启动任务，池满时可由 Degrade 降级到池外执行，任务结束后送出一次 Result。巡检只告警。</desc>
  <rect width="1240" height="1160" fill="#020617"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="1240" height="1160" fill="url(#grid)"/>

  <text x="40" y="40" fill="#f8fafc" font-size="22" font-weight="700">loom 提交与调度流程</text>
  <text x="40" y="64" fill="#94a3b8" font-size="13">协调者串行改运行表。用户函数在任务协程里执行。Submit 不等待函数结束。</text>

  <text x="40" y="100" fill="#22d3ee" font-size="12" font-weight="600">1. 提交</text>

  <rect x="40" y="114" width="250" height="76" rx="8" fill="#0f172a"/>
  <rect x="40" y="114" width="250" height="76" rx="8" fill="rgba(8, 51, 68, 0.55)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="165" y="144" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Submit(sign, fn, opts)</text>
  <text x="165" y="166" fill="#94a3b8" font-size="12" text-anchor="middle">来源标记不参与排序</text>

  <line x1="290" y1="152" x2="346" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="354" y="114" width="210" height="76" rx="8" fill="#0f172a"/>
  <rect x="354" y="114" width="210" height="76" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="459" y="144" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">nil 检查</text>
  <text x="459" y="166" fill="#94a3b8" font-size="12" text-anchor="middle">p == nil 或 fn == nil</text>

  <line x1="564" y1="152" x2="620" y2="152" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="588" y="142" fill="#fb7185" font-size="11" text-anchor="middle">是</text>

  <rect x="628" y="114" width="340" height="76" rx="8" fill="#0f172a"/>
  <rect x="628" y="114" width="340" height="76" rx="8" fill="rgba(136, 19, 55, 0.35)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="798" y="144" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">立即送出一次错误 Result</text>
  <text x="798" y="166" fill="#94a3b8" font-size="12" text-anchor="middle">ErrNilPool 优先。不进协调者</text>

  <line x1="459" y1="190" x2="459" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="472" y="216" fill="#94a3b8" font-size="11">否</text>

  <rect x="324" y="238" width="270" height="76" rx="8" fill="#0f172a"/>
  <rect x="324" y="238" width="270" height="76" rx="8" fill="rgba(251, 146, 60, 0.18)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="459" y="268" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">操作缓冲，容量 100</text>
  <text x="459" y="290" fill="#94a3b8" font-size="12" text-anchor="middle">放进缓冲后 Submit 就返回</text>

  <line x1="594" y1="276" x2="650" y2="276" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="618" y="266" fill="#fb923c" font-size="11" text-anchor="middle">满</text>

  <rect x="658" y="238" width="310" height="76" rx="8" fill="#0f172a"/>
  <rect x="658" y="238" width="310" height="76" rx="8" fill="rgba(251, 146, 60, 0.18)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="813" y="268" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">另开一条协程阻塞发送</text>
  <text x="813" y="290" fill="#94a3b8" font-size="12" text-anchor="middle">调用方已经返回，不再等待</text>

  <text x="210" y="356" fill="#34d399" font-size="12" font-weight="600">2. 协调者。运行表、队列和计数只在这里改</text>
  <rect x="32" y="366" width="1176" height="292" rx="12" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="8 4"/>

  <polyline points="459,314 459,328 167,328 167,386" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="52" y="390" width="230" height="76" rx="8" fill="#0f172a"/>
  <rect x="52" y="390" width="230" height="76" rx="8" fill="rgba(6, 78, 59, 0.45)" stroke="#34d399" stroke-width="1.5"/>
  <text x="167" y="420" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">accept，分配 ID</text>
  <text x="167" y="442" fill="#94a3b8" font-size="12" text-anchor="middle">sign 原样记下</text>

  <line x1="282" y1="428" x2="338" y2="428" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="346" y="390" width="230" height="76" rx="8" fill="#0f172a"/>
  <rect x="346" y="390" width="230" height="76" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="461" y="420" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">有空闲槽位？</text>
  <text x="461" y="442" fill="#94a3b8" font-size="12" text-anchor="middle">len(running) &lt; Size</text>

  <line x1="167" y1="466" x2="167" y2="508" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="180" y="492" fill="#34d399" font-size="11">是</text>

  <rect x="52" y="516" width="280" height="112" rx="8" fill="#0f172a"/>
  <rect x="52" y="516" width="280" height="112" rx="8" fill="rgba(6, 78, 59, 0.45)" stroke="#34d399" stroke-width="1.5"/>
  <text x="192" y="550" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">标成 Running，启动 1 条协程</text>
  <text x="192" y="572" fill="#94a3b8" font-size="12" text-anchor="middle">Submitted + 1</text>
  <text x="192" y="594" fill="#94a3b8" font-size="12" text-anchor="middle">不调用 Degrade</text>

  <line x1="576" y1="428" x2="668" y2="428" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="612" y="418" fill="#94a3b8" font-size="11" text-anchor="middle">否</text>

  <rect x="676" y="390" width="250" height="76" rx="8" fill="#0f172a"/>
  <rect x="676" y="390" width="250" height="76" rx="8" fill="rgba(120, 53, 15, 0.35)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="801" y="420" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Degrade(running)</text>
  <text x="801" y="442" fill="#94a3b8" font-size="12" text-anchor="middle">在协调者之外查看</text>

  <line x1="801" y1="466" x2="801" y2="508" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="814" y="492" fill="#fbbf24" font-size="11">true</text>

  <rect x="676" y="516" width="250" height="112" rx="8" fill="#0f172a"/>
  <rect x="676" y="516" width="250" height="112" rx="8" fill="rgba(120, 53, 15, 0.35)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="801" y="548" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">池外直接执行</text>
  <text x="801" y="570" fill="#94a3b8" font-size="12" text-anchor="middle">不占 Size，不进运行表</text>
  <text x="801" y="592" fill="#94a3b8" font-size="12" text-anchor="middle">结束后取快照并送出 Result</text>

  <line x1="926" y1="428" x2="984" y2="548" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="940" y="500" fill="#94a3b8" font-size="11">false</text>

  <rect x="992" y="516" width="192" height="112" rx="8" fill="#0f172a"/>
  <rect x="992" y="516" width="192" height="112" rx="8" fill="rgba(251, 146, 60, 0.18)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1088" y="548" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">优先级队列</text>
  <text x="1088" y="570" fill="#94a3b8" font-size="12" text-anchor="middle">未设置或回调 panic</text>
  <text x="1088" y="590" fill="#94a3b8" font-size="12" text-anchor="middle">也走这里</text>
  <text x="1088" y="610" fill="#94a3b8" font-size="12" text-anchor="middle">数值大，同值 ID 小</text>

  <text x="250" y="696" fill="#a78bfa" font-size="12" font-weight="600">3. 池内任务协程。下一个用户函数要等本次 Result 送出后才启动</text>

  <line x1="192" y1="628" x2="192" y2="708" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="40" y="712" width="230" height="88" rx="8" fill="#0f172a"/>
  <rect x="40" y="712" width="230" height="88" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="155" y="746" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">执行用户函数</text>
  <text x="155" y="768" fill="#94a3b8" font-size="12" text-anchor="middle">panic 恢复成 *PanicError</text>

  <line x1="270" y1="756" x2="326" y2="756" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="334" y="712" width="270" height="88" rx="8" fill="#0f172a"/>
  <rect x="334" y="712" width="270" height="88" rx="8" fill="rgba(6, 78, 59, 0.45)" stroke="#34d399" stroke-width="1.5"/>
  <text x="469" y="744" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">finish，仍在协调者里</text>
  <text x="469" y="766" fill="#94a3b8" font-size="12" text-anchor="middle">终态。有队列则下一个先标 Running</text>
  <text x="469" y="784" fill="#94a3b8" font-size="12" text-anchor="middle">放进 ready，再复制快照</text>

  <line x1="604" y1="756" x2="660" y2="756" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="668" y="712" width="240" height="88" rx="8" fill="#0f172a"/>
  <rect x="668" y="712" width="240" height="88" rx="8" fill="rgba(8, 51, 68, 0.55)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="788" y="746" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">送出一次 Result</text>
  <text x="788" y="768" fill="#94a3b8" font-size="12" text-anchor="middle">channel 容量 1，然后 close</text>

  <line x1="908" y1="756" x2="964" y2="756" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="972" y="712" width="228" height="88" rx="8" fill="#0f172a"/>
  <rect x="972" y="712" width="228" height="88" rx="8" fill="rgba(6, 78, 59, 0.45)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1086" y="746" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">release</text>
  <text x="1086" y="768" fill="#94a3b8" font-size="12" text-anchor="middle">启动 ready 里的下一个</text>

  <text x="40" y="840" fill="#fb7185" font-size="12" font-weight="600">4. 巡检与池内执行并行。阈值小于 0 时不启动</text>

  <rect x="40" y="856" width="280" height="80" rx="8" fill="#0f172a"/>
  <rect x="40" y="856" width="280" height="80" rx="8" fill="rgba(136, 19, 55, 0.35)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="180" y="886" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">间隔 min(阈值, 1s)</text>
  <text x="180" y="908" fill="#94a3b8" font-size="12" text-anchor="middle">零值阈值按 30s</text>

  <line x1="320" y1="896" x2="376" y2="896" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>

  <rect x="384" y="856" width="360" height="80" rx="8" fill="#0f172a"/>
  <rect x="384" y="856" width="360" height="80" rx="8" fill="rgba(6, 78, 59, 0.45)" stroke="#34d399" stroke-width="1.5"/>
  <text x="564" y="886" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">协调者合并跨过的周期</text>
  <text x="564" y="908" fill="#94a3b8" font-size="12" text-anchor="middle">Alerted + 1，然后才离开协调者</text>

  <line x1="744" y1="896" x2="800" y2="896" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>

  <rect x="808" y="856" width="392" height="80" rx="8" fill="#0f172a"/>
  <rect x="808" y="856" width="392" height="80" rx="8" fill="rgba(136, 19, 55, 0.35)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1004" y="886" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">OnAlert，按任务 ID 顺序</text>
  <text x="1004" y="908" fill="#94a3b8" font-size="12" text-anchor="middle">不取消、不改优先级。回调 panic 会恢复</text>

  <rect x="32" y="968" width="1176" height="156" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="52" y="998" fill="#f8fafc" font-size="13" font-weight="600">计数怎么来</text>
  <text x="52" y="1024" fill="#94a3b8" font-size="12">Running = len(running)。Waiting = 队列长度。Idle = Size - Running。有人排队时 Idle 为 0。</text>
  <text x="52" y="1048" fill="#94a3b8" font-size="12">降级任务会占一个 ID，避免后提交的任务插到前面，但这个 ID 不出现在运行表，也不计入 Submitted。</text>
  <text x="52" y="1072" fill="#94a3b8" font-size="12">快照属于终态那一刻，不是后来执行接收的那一刻。没人接收也不会堵住任务协程。</text>
  <text x="52" y="1096" fill="#94a3b8" font-size="12">协调者和巡检随进程存在。池子没有 Close，也没有取消入口。</text>
</svg>
